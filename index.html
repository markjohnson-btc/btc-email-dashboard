<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Media — Email Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f7f6f3;
    --bg3: #f1efe8;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --radius: 8px;
    --radius-lg: 12px;
    --purple: #534AB7;
    --blue: #185FA5;
    --teal: #0F6E56;
    --amber: #854F0B;
    --red: #A32D2D;
    --green: #1D9E75;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --bg2: #242422; --bg3: #2c2c2a;
      --text: #f1efe8; --text2: #b4b2a9; --text3: #888780;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
    }
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 32px; height: 32px; background: var(--text); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .brand-icon svg { fill: var(--bg); width: 18px; height: 18px; }
  .brand-text h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  .brand-text p { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .last-updated { font-size: 11px; color: var(--text3); }

  .btn { font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.15s; font-family: 'Inter', sans-serif; }
  .btn:hover { opacity: 0.75; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-dark { background: var(--text); color: var(--bg); border-color: var(--text); }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .kpi { background: var(--bg); border-radius: var(--radius-lg); padding: 16px 18px; border: 1px solid var(--border); position: relative; overflow: hidden; }
  .kpi-accent { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
  .kpi-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
  .kpi-delta { font-size: 11px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .up { color: #1D9E75; } .down { color: #E24B4A; } .warn { color: #BA7517; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .card { background: var(--bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 1.25rem; }
  .card.full { grid-column: 1 / -1; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .card-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); }
  .pill { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 500; }
  .pill-warn { background: #FAEEDA; color: #854F0B; }
  .pill-good { background: #E1F5EE; color: #0F6E56; }
  .pill-info { background: #E6F1FB; color: #185FA5; }

  .legend { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
  .legend-line { width: 18px; height: 2px; border-radius: 1px; }
  .legend-dash { width: 18px; height: 0; border-top: 2px dashed; }

  .chart-wrap { position: relative; }

  .score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .score-card { border-radius: var(--radius); padding: 12px; text-align: center; }
  .score-A { background: #E1F5EE; } .score-B { background: #EAF3DE; }
  .score-C { background: #FAEEDA; } .score-D { background: #FCEBEB; }
  .score-grade { font-size: 24px; font-weight: 700; }
  .score-A .score-grade { color: #0F6E56; } .score-B .score-grade { color: #3B6D11; }
  .score-C .score-grade { color: #854F0B; } .score-D .score-grade { color: #A32D2D; }
  .score-name { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .score-val { font-size: 12px; font-weight: 600; color: var(--text); margin-top: 3px; }

  .insights { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .insights li { font-size: 13px; color: var(--text2); line-height: 1.6; display: flex; gap: 9px; align-items: flex-start; }
  .ins-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }

  .state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 14px; color: var(--text3); font-size: 14px; }
  .spinner { width: 22px; height: 22px; border: 2px solid var(--border2); border-top-color: var(--text2); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; text-align: center; color: var(--text2); font-size: 14px; line-height: 1.7; }
  .error-card strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 15px; }

  @media (max-width: 600px) {
    .grid-2 { grid-template-columns: 1fr; }
    .score-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi-value { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="brand-text">
        <h1>Email Performance</h1>
        <p id="last-updated">Loading...</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn" id="refresh-btn" onclick="loadData()">↺ Refresh data</button>
      <button class="btn btn-dark" id="push-btn" onclick="pushToNotion()" style="display:none">Push summary to Notion ↗</button>
    </div>
  </div>

  <div id="loading" class="state">
    <div class="spinner"></div>
    Connecting to Notion and loading email data...
  </div>

  <div id="error-state" style="display:none" class="error-card">
    <strong>Couldn't load data</strong>
    <span id="error-msg"></span><br><br>
    <button class="btn" onclick="loadData()">Try again</button>
  </div>

  <div id="dashboard" style="display:none">

    <div class="kpi-row" id="kpi-row"></div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Open rate</span>
          <span class="pill pill-warn" id="open-pill"></span>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-line" style="background:#185FA5"></div>Open rate</div>
          <div class="legend-item"><div class="legend-dash" style="border-color:#1D9E75"></div>Industry avg 25%</div>
        </div>
        <div class="chart-wrap" style="height:200px"><canvas id="openChart" role="img" aria-label="Open rate trend over time"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Click-through rate</span>
          <span class="pill pill-good" id="ctr-pill"></span>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-line" style="background:#0F6E56"></div>CTR</div>
          <div class="legend-item"><div class="legend-dash" style="border-color:#BA7517"></div>Benchmark 3%</div>
        </div>
        <div class="chart-wrap" style="height:200px"><canvas id="ctrChart" role="img" aria-label="CTR trend over time"></canvas></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card full">
        <div class="card-header">
          <span class="card-title">Delivered volume</span>
          <span class="pill pill-info" id="vol-pill"></span>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-line" style="background:#534AB7;height:10px;border-radius:2px;opacity:0.7"></div>Monthly delivered</div>
        </div>
        <div class="chart-wrap" style="height:160px"><canvas id="volChart" role="img" aria-label="Monthly email volume delivered"></canvas></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header"><span class="card-title">Health scorecard</span></div>
        <div class="score-grid" id="score-grid"></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Key insights</span></div>
        <ul class="insights" id="insights"></ul>
      </div>
    </div>

  </div>
</div>

<script>
const NOTION_MCP = "https://mcp.notion.com/mcp";
const DATA_PAGE_ID = "cb435f1a639a40519faacf7f15668b72";
const CALENDAR_PAGE_ID = "36ece4a365ae806a8a2fcf9553a6ae4d";

let lastData = null;
let chartInstances = {};

async function callClaude(systemPrompt, userPrompt, mcpServers) {
  const body = {
    model: "claude-sonnet-4-20250514",
    max_tokens: 1000,
    system: systemPrompt,
    messages: [{ role: "user", content: userPrompt }]
  };
  if (mcpServers) body.mcp_servers = mcpServers;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("API error: " + res.status);
  const d = await res.json();
  return d.content.filter(b => b.type === "text").map(b => b.text).join("");
}

async function loadData() {
  show("loading"); hide("dashboard"); hide("error-state");
  document.getElementById("refresh-btn").disabled = true;

  try {
    const raw = await callClaude(
      `You are a data extraction assistant. Read the Notion page and extract all email campaign rows. Return ONLY a valid JSON array, no markdown, no explanation. Each object must have: name (string), sent_date (string YYYY-MM), sent (number), opens (number), open_rate (number 0-100), clicks (number), ctr (number 0-100), bounces (number|null), bounce_rate (number|null), unsubscribes (number|null), unsub_rate (number|null). Use null for missing fields.`,
      `Read Notion page ID ${DATA_PAGE_ID} which contains HubSpot email performance export data. Extract every email campaign row and return as a JSON array.`,
      [{ type: "url", url: NOTION_MCP, name: "notion" }]
    );

    const clean = raw.replace(/```json|```/g, "").trim();
    const rows = JSON.parse(clean);
    if (!rows.length) throw new Error("No rows found in the data page.");

    lastData = rows;
    renderAll(rows);
    show("dashboard");
    document.getElementById("push-btn").style.display = "inline-flex";
    document.getElementById("last-updated").textContent =
      "Updated " + new Date().toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });

  } catch (err) {
    show("error-state");
    document.getElementById("error-msg").textContent = err.message;
  } finally {
    hide("loading");
    document.getElementById("refresh-btn").disabled = false;
  }
}

function renderAll(rows) {
  const sorted = [...rows].sort((a, b) => (a.sent_date || "").localeCompare(b.sent_date || ""));
  const labels = sorted.map(r => fmtLabel(r.sent_date || r.name || "?"));

  const validOpen = sorted.filter(r => r.open_rate != null);
  const validCtr = sorted.filter(r => r.ctr != null);
  const totalSent = rows.reduce((s, r) => s + (r.sent || 0), 0);
  const peakVol = Math.max(...rows.map(r => r.sent || 0));
  const avgOpen = avg(validOpen, "open_rate");
  const avgCtr = avg(validCtr, "ctr");
  const latestOpen = validOpen.length ? validOpen[validOpen.length - 1].open_rate : null;
  const latestCtr = validCtr.length ? validCtr[validCtr.length - 1].ctr : null;

  // KPIs
  document.getElementById("kpi-row").innerHTML = [
    { label: "Latest open rate", val: fmt(latestOpen, "%"), sub: "Most recent campaign", cls: latestOpen > 25 ? "up" : "down" },
    { label: "Latest CTR", val: fmt(latestCtr, "%"), sub: "Most recent campaign", cls: latestCtr > 5 ? "up" : latestCtr > 2 ? "warn" : "down" },
    { label: "Total delivered", val: num(totalSent), sub: rows.length + " campaigns", cls: "up" },
    { label: "Peak volume", val: num(peakVol), sub: "Single campaign", cls: "up" },
    { label: "Avg open rate", val: fmt(avgOpen, "%"), sub: "All time", cls: avgOpen > 25 ? "up" : "warn" },
    { label: "Avg CTR", val: fmt(avgCtr, "%"), sub: "All time", cls: avgCtr > 3 ? "up" : "warn" },
  ].map(k => `<div class="kpi">
    <div class="kpi-label">${k.label}</div>
    <div class="kpi-value">${k.val}</div>
    <div class="kpi-delta ${k.cls}">${k.sub}</div>
    <div class="kpi-accent" style="background:${k.cls === 'up' ? '#1D9E75' : k.cls === 'down' ? '#E24B4A' : '#BA7517'}"></div>
  </div>`).join("");

  // Pills
  document.getElementById("open-pill").textContent = latestOpen > 25 ? "Above benchmark" : "Below benchmark";
  document.getElementById("ctr-pill").textContent = latestCtr > 3 ? "Above benchmark ↑" : "Watch this ↓";
  document.getElementById("vol-pill").textContent = "Peak: " + num(peakVol);

  const gc = "rgba(128,128,128,0.1)";
  const tc = "#888780";
  const baseOpts = (suffix) => ({
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 10 }, color: tc, maxTicksLimit: 8, maxRotation: 0 } },
      y: { grid: { color: gc }, ticks: { font: { size: 11 }, color: tc, callback: v => v + suffix } }
    }
  });

  mkChart("openChart", "line", {
    labels,
    datasets: [
      { data: sorted.map(r => r.open_rate), borderColor: "#185FA5", backgroundColor: hexAlpha("#185FA5", 0.1), tension: 0.4, fill: true, pointRadius: 2, borderWidth: 2 },
      { data: Array(sorted.length).fill(25), borderColor: "#1D9E75", borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, fill: false }
    ]
  }, { ...baseOpts("%"), scales: { ...baseOpts("%").scales, y: { ...baseOpts("%").scales.y, min: 0 } } });

  mkChart("ctrChart", "line", {
    labels,
    datasets: [
      { data: sorted.map(r => r.ctr), borderColor: "#0F6E56", backgroundColor: hexAlpha("#0F6E56", 0.1), tension: 0.4, fill: true, pointRadius: 2, borderWidth: 2 },
      { data: Array(sorted.length).fill(3), borderColor: "#BA7517", borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0, fill: false }
    ]
  }, baseOpts("%"));

  mkChart("volChart", "bar", {
    labels,
    datasets: [{
      data: sorted.map(r => r.sent || 0),
      backgroundColor: sorted.map(r => (r.sent || 0) === peakVol ? "#534AB7" : "rgba(83,74,183,0.4)"),
      borderRadius: 3
    }]
  }, {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 10 }, color: tc, maxTicksLimit: 8, maxRotation: 0 } },
      y: { grid: { color: gc }, ticks: { font: { size: 11 }, color: tc, callback: v => v >= 1000 ? (v / 1000).toFixed(0) + "K" : v } }
    }
  });

  // Scorecard
  const scores = [
    { name: "Open rate", val: fmt(latestOpen, "%"), g: latestOpen >= 40 ? "A" : latestOpen >= 25 ? "B" : latestOpen >= 15 ? "C" : "D" },
    { name: "CTR", val: fmt(latestCtr, "%"), g: latestCtr >= 10 ? "A" : latestCtr >= 3 ? "B" : latestCtr >= 1 ? "C" : "D" },
    { name: "Volume", val: num(peakVol), g: peakVol >= 100000 ? "A" : peakVol >= 30000 ? "B" : "C" },
    { name: "Trend", val: "See chart", g: latestOpen > avgOpen ? "B" : "C" },
  ];
  document.getElementById("score-grid").innerHTML = scores.map(s =>
    `<div class="score-card score-${s.g}"><div class="score-grade">${s.g}</div><div class="score-name">${s.name}</div><div class="score-val">${s.val}</div></div>`
  ).join("");

  // Insights
  const ins = [];
  if (latestOpen < 25) ins.push({ c: "#E24B4A", t: `Open rate is below the 25% industry average at ${fmt(latestOpen, "%")} — consider subject line testing or list re-engagement.` });
  else ins.push({ c: "#1D9E75", t: `Open rate of ${fmt(latestOpen, "%")} is above the 25% industry benchmark — strong deliverability.` });
  if (latestCtr > 10) ins.push({ c: "#1D9E75", t: `CTR of ${fmt(latestCtr, "%")} is exceptional — the most recent campaign drove unusually high click engagement.` });
  ins.push({ c: "#534AB7", t: `Peak volume reached ${num(peakVol)} delivered in a single campaign — list growth is strong.` });
  ins.push({ c: "#BA7517", t: `Avg open rate across all campaigns is ${fmt(avgOpen, "%")} — monitor trend direction monthly.` });
  document.getElementById("insights").innerHTML = ins.map(i =>
    `<li><div class="ins-dot" style="background:${i.c}"></div>${i.t}</li>`
  ).join("");
}

async function pushToNotion() {
  if (!lastData) return;
  const btn = document.getElementById("push-btn");
  btn.disabled = true; btn.textContent = "Pushing...";
  try {
    await callClaude(
      "You update Notion pages via MCP. Append a dated email performance summary callout block to the specified page.",
      `Append a callout block to Notion page ID ${CALENDAR_PAGE_ID}. 
Title it: "📊 Email Performance — ${new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}".
Body: 2-3 sentences summarizing overall email health based on this data sample: ${JSON.stringify(lastData.slice(0, 8))}.
Keep it factual and concise.`,
      [{ type: "url", url: NOTION_MCP, name: "notion" }]
    );
    btn.textContent = "✓ Pushed to Notion";
    setTimeout(() => { btn.textContent = "Push summary to Notion ↗"; btn.disabled = false; }, 3000);
  } catch (e) {
    btn.textContent = "Push failed — try again";
    btn.disabled = false;
  }
}

function mkChart(id, type, data, options) {
  if (chartInstances[id]) chartInstances[id].destroy();
  chartInstances[id] = new Chart(document.getElementById(id), { type, data, options });
}

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function avg(arr, key) { return arr.length ? arr.reduce((s, r) => s + (r[key] || 0), 0) / arr.length : 0; }
function fmt(v, suffix) { return v == null ? "—" : parseFloat(v).toFixed(1) + (suffix || ""); }
function num(v) { return v == null ? "—" : Math.round(v).toLocaleString(); }
function fmtLabel(s) { return s.length > 16 ? s.substring(0, 15) + "…" : s; }
function show(id) { document.getElementById(id).style.display = ""; }
function hide(id) { document.getElementById(id).style.display = "none"; }

loadData();
</script>
</body>
</html>
